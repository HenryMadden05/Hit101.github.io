<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.1.0"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "layer": [{"mark": {"type": "circle", "color": "#e07a5f", "size": 90}, "encoding": {"tooltip": [{"field": "word", "type": "nominal"}, {"field": "count", "type": "quantitative"}, {"field": "average_popularity", "type": "quantitative"}], "x": {"field": "count", "scale": {"type": "log"}, "title": "Number of Titles Containing the Word", "type": "quantitative"}, "y": {"field": "average_popularity", "scale": {"domain": [45, 60]}, "title": "Average Popularity Score", "type": "quantitative"}}}, {"mark": {"type": "text", "align": "left", "baseline": "middle", "dx": 8}, "encoding": {"text": {"field": "word", "type": "nominal"}, "x": {"field": "count", "scale": {"type": "log"}, "type": "quantitative"}, "y": {"field": "average_popularity", "scale": {"domain": [45, 60]}, "type": "quantitative"}}}], "data": {"name": "data-5003e85f1f345e1b1cdae4f6f4d0ae63"}, "height": 400, "title": "How Common Title Words Relate to Song Popularity", "width": 600, "$schema": "https://vega.github.io/schema/vega-lite/v6.1.0.json", "datasets": {"data-5003e85f1f345e1b1cdae4f6f4d0ae63": [{"word": "love", "count": 305, "average_popularity": 55.15}, {"word": "remix", "count": 108, "average_popularity": 50.23}, {"word": "girl", "count": 75, "average_popularity": 51.44}, {"word": "bad", "count": 73, "average_popularity": 50.88}, {"word": "good", "count": 63, "average_popularity": 53.49}, {"word": "baby", "count": 60, "average_popularity": 58.65}, {"word": "night", "count": 59, "average_popularity": 57.32}, {"word": "man", "count": 59, "average_popularity": 50.63}, {"word": "world", "count": 56, "average_popularity": 47.61}, {"word": "heart", "count": 55, "average_popularity": 51.62}]}};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
